<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kc = n => (Math.round(n)||0).toLocaleString('cs-CZ').replace(/ /g,' ') + ' Kč';
const MES = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const mLabel = ym => { const [y,m] = ym.split('-').map(Number); return `${MES[m-1]} ${y}`; };
const dShort = d => d ? d.slice(8,10).replace(/^0/,'')+'. '+d.slice(5,7).replace(/^0/,'')+'.' : 'z přeplatku';
// pás měsíců: u každého předpisu kdy a čím byl zaplacen, nebo kolik chybí
function mesicePas(k){
  const today = [todayISO(), S.nast.vypisDo || '9999'].sort()[0];
  const pr = k.polozky.filter(x=>x.typ==='Předpis').sort((a,b)=>a.ym.localeCompare(b.ym));
  if (!pr.length) return '';
  return `<div class="mp">${pr.map(x=>{
    const zb = x.castka - x.uhrazeno, kdy = (x.pl||[]).map(p=>dShort(p.d)).join(' + ');
    const cls = zb < 0.5 ? 'ok' : x.due > today ? 'fut' : x.uhrazeno > 0.5 ? 'part' : 'bad';
    const txt = zb < 0.5 ? `zapl. ${kdy}` : x.due > today ? 'ještě není splatné' : x.uhrazeno > 0.5 ? `chybí ${kc(zb)}` : `dluh ${kc(zb)}`;
    return `<span class="${cls}" title="${mLabel(x.ym)}: předpis ${kc(x.castka)}, uhrazeno ${kc(x.uhrazeno)}${kdy?' ('+kdy+')':''}"><b>${mLabel(x.ym)}</b>${txt}</span>`;
  }).join('')}</div>`;
}
const addM = (ym, k) => { let [y,m] = ym.split('-').map(Number); m += k; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12+1; return `${y}-${String(m).padStart(2,'0')}`; };
const nowYM = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const todayISO = () => new Date().toISOString().slice(0,10);
const normAcct = a => String(a||'').replace(/\s+/g,'').replace(/^0+-?/,'').toLowerCase();
function rozpis(total, spl, od, typ, day, vlastni){
  if (Array.isArray(vlastni) && vlastni.length) return vlastni.filter(x=>x && x.due && +x.castka>0).map(x=>({typ, ym:x.due.slice(0,7), due:x.due, castka:+x.castka, uhrazeno:0, dluh:true}));
  const out = []; let left = +total || 0; spl = +spl || 0; let m = od || S.nast.pocatek, i = 0;
  while (left > 0.5 && i < 600) { const c = spl > 0 ? Math.min(spl, left) : left; out.push({typ, ym:m, due:`${m}-${day}`, castka:c, uhrazeno:0, dluh:true}); left -= c; m = addM(m,1); i++; }
  return out;
}
const UCEL = {'':'Automaticky', najem:'Nájem', sluzby:'Služby', dluh:'Starý dluh'};
// Rozdělí platbu podle výše: přesně předpis → nájem, přesně splátka služeb → služby, součet → obojí, jinak nejstarší dluh.
// Předpis platný v daném měsíci: dřívější částky jsou uložené jako "do měsíce X platil Y" (predpisHist), jinak aktuální předpis.
function predpisFor(o, ym){
  const h = (o.predpisHist||[]).filter(x=>x.do && ym && ym <= x.do).sort((a,b)=>a.do.localeCompare(b.do))[0];
  return h ? (+h.castka||0) : (+o.predpis||0);
}
// "08/2026 5.986" / "do 8.2026 5 986 Kč" → {do:'2026-08', castka:5986}
function parseHist(txt){
  return (txt||'').split('\n').map(l=>l.trim().match(/^(?:do\s*)?(\d{1,2})\s*[\/.]\s*(\d{4})\s+([\d\s.,]+)/i)).filter(Boolean)
    .map(m=>({do:`${m[2]}-${m[1].padStart(2,'0')}`, castka:+m[3].trim().replace(/,\d{1,2}$/,'').replace(/[\s.,]/g,'')})).filter(x=>x.castka>0);
}
function histPreview(txt, predpis, od){
  const h = parseHist(txt).sort((a,b)=>a.do.localeCompare(b.do));
  if (!h.length) return '';

  // dluh za nájem z doby před začátkem evidence (první splátka dřív než evidence) se nepočítá – ani jeho splátky
  const staryDluh = dl0.length > 0 && dl0.map(x=>x.due).sort()[0] < pocatek+'-01';

    for (const x of due.concat(fut.filter(x=>x.dluh), fut.filter(x=>!x.dluh))) { amt = pay(x, amt); if (amt < 0.005) break; }

    .map(p => ({p, d: p.datum || (p.obdobi ? p.obdobi+'-15' : '')})).sort((a,b)=>a.d.localeCompare(b.d));
  let preplatek = 0, zaplaceno = 0; const rozdeleni = {};

    if (staryDluh && r.dluh) { rozdeleni[p._id] = 'Splátka starého dluhu z doby před evidencí, nepočítá se'; continue; }
    const pred0 = d && d < pocatek+'-01';  // před začátkem evidence se počítají jen splátky služeb a starých dluhů
    if (pred0) {

      if (r.dluh) { zaplaceno += r.dluh; alloc(dl, r.dluh, false); }

    if (r.dluh) preplatek += alloc(dl, r.dluh, false);

  h += `<div class="phone" lang="${L}"><div class="hello row" style="justify-content:space-between;align-items:flex-start"><div><b>${t.hello}, ${esc(o.jmeno.split(' ')[0])}</b><span>${esc(a.adresa||'')}</span></div>
    <div class="seg" role="group" aria-label="Jazyk / Language"><button type="button" data-lang="cs" aria-pressed="${L==='cs'}">CZ</button><button type="button" data-lang="en" aria-pressed="${L==='en'}">EN</button></div></div>`;
  if (kontrolaStav(o).zamceno) return h + kontrolaLock(o, L) + '</div>';
  h += oznCard(o, L);
  h += nastenkaCard(o, L);
  h += kontrolaCard(o, L);
  const pasHore = pasPotreba(o);
  if (pasHore) h += pasCard(o, L);
  if (o.srazkaOd) h += `<div class="card"><h3>${t.rentH}</h3><p>${t.srazka(mL(o.srazkaOd,L))}</p></div>`;
  if (!TRIAL && p.overSum > 0.5) {
    h += `<section class="card due"><h3>${t.overH}</h3>
      <div class="big bad">${kcL(p.overSum,L)}</div>
      <p class="acct">${t.overP(fD(p.overdue[0].due))}</p>
      <div class="split">${splitRows(p.overdue, L)}</div>
      ${payBlock(o, p.overSum, 'Doplatek', L)}
    </section>`;
  }
  if (!TRIAL && (p.nextSum > 0.5 || p.next.length)) {
    h += `<section class="card"><h3>${t.nextH}</h3>
      <div class="row" style="justify-content:space-between;align-items:baseline"><div class="big">${kcL(p.nextSum,L)}</div><span class="pill mute">${t.dueBy(fD(p.nextDue))}</span></div>
      <div class="split">${p.next.map(x=>`<div><span>${t.TYP[x.typ]} · ${mL(x.due.slice(0,7),L)}</span><span>${kcL(x.castka,L)}</span></div>`).join('')}
        ${p.kred>0.5?`<div><span>${t.credit}</span><span>−${kcL(p.kred,L)}</span></div>`:''}</div>
      ${p.nextSum > 0.5 ? payBlock(o, p.nextSum, (TYP[p.next[0]?.typ]||'Platba')+' '+mLabel(p.nextYM), L) : `<p class="acct">${t.covered}</p>`}
      <p class="acct">${t.remind(S.nast.dniPred)}</p>
    </section>`;
  } else if (!TRIAL && platce && p.overSum < 0.5) {
    h += `<section class="card"><h3>${t.payH}</h3><p>${t.nothing}</p></section>`;
  }
  h += zadostCard(o, L);
  if (S.admin && !o.vs && o.plati) h += `<div class="warnbox" lang="cs">Jen pro vás: tento nájemník nemá variabilní symbol. Platba se pak páruje jen podle jména a účtu. Doplňte VS v přehledu plateb.</div>`;

  const sekce = [['Splátka služeb', t.billH, +o.sDluh, k.sluzbyZbyva], ['Splátka dluhu', t.planH, +o.dluh, k.dluhZbyva]];
  if (!TRIAL) for (const [typ, nadpis, celkem, zbyva] of sekce) {
    if (!(celkem > 0) || k.staryDluh && typ==='Splátka dluhu') continue;
    const items = k.polozky.filter(x=>x.typ===typ).sort((a,b)=>a.due.localeCompare(b.due));
    const pct = celkem ? Math.min(100, 100*(celkem-zbyva)/celkem) : 0;
    h += `<section class="card"><h3>${nadpis}</h3>
      <div class="row" style="justify-content:space-between;align-items:baseline"><div><span class="big">${kcL(zbyva,L)}</span> <span class="acct">${t.left}</span></div><span class="acct">${t.of} ${kcL(celkem,L)}</span></div>
      <div class="bar" role="img" aria-label="${Math.round(pct)} %"><i style="width:${pct}%"></i></div>
      <div class="list">${items.map(x=>{const z=x.castka-x.uhrazeno; const st = z<0.5?`<span class="pill ok">${t.paid}</span>`:x.due<=p.today?`<span class="pill bad">${t.missing(kcL(z,L))}</span>`:`<span class="pill mute">${t.waiting}</span>`; return `<div class="li"><span>${fD(x.due)}</span><span class="r">${kcL(x.castka,L)} ${st}</span></div>`;}).join('')}</div>
    </section>`;
  }
  const pl = S.platby.filter(x=>x.osobaId===o.id && x.datum).sort((a,b)=>b.datum.localeCompare(a.datum));
  const lbl = x => { const r = (k.rozdeleni[x._id]||'').replace(/ \(.*\)$/,''); if (L==='cs') return r;
    return /služby/i.test(r) && /nájem/i.test(r) ? 'Rent + utilities' : /služby/i.test(r) ? 'Utility bill' : /dluh/i.test(r) ? 'Debt' : /nájem/i.test(r) ? 'Rent' : ''; };
  if (!TRIAL && platce) h += `<section class="card"><h3>${t.histH}</h3>${pasL(k, L)}
    <div class="list">${pl.slice(0,6).map(x=>`<div class="li"><span>${fD(x.datum)}<br><span class="acct">${esc(lbl(x))}</span></span><span class="r"><b>${kcL(x.castka,L)}</b></span></div>`).join('') || `<p class="acct">${t.none}</p>`}</div>
    ${pl.length>6?`<details class="more"><summary>${t.all(pl.length)}</summary><div class="list">${pl.slice(6).map(x=>`<div class="li"><span>${fD(x.datum)}</span><span class="r">${kcL(x.castka,L)}</span></div>`).join('')}</div></details>`:''}
    <p class="acct">${t.asOf(fD(S.nast.vypisDo||refDay()))}</p>
  </section>`;

  h += bydleniCard(o, L);
  h += schuzkaCard(o, L);
  h += vodaCard(L, o);
  const moje = S.pozadavky.filter(r=>r.osobaId===o.id).sort((a,b)=>(b.vytvoreno||'').localeCompare(a.vytvoreno||''));
  h += `<section class="card"><h3>${t.mntH}</h3>
    ${moje.length?`<div class="list" style="gap:8px">${moje.map(r=>{const c=(STAV[r.stav]||['mute'])[0]; return `<div class="req"><div class="row" style="justify-content:space-between"><b>${esc(katL(r.kategorie,L))}</b><span class="pill ${c}">${t.STAV[r.stav]||r.stav}</span></div><span>${esc(r.popis)}</span>${fotkyHtml(r)}<span class="acct">${t.reported(fD(r.vytvoreno.slice(0,10)))}${r.stav==='zamitnuto'&&r.duvod?` · ${esc(r.duvod)}`:''}</span></div>`;}).join('')}</div>`:`<p class="acct">${t.noReq}</p>`}
    <details class="more" id="reqDetails"${moje.length?'':' open'}><summary>${t.add}</summary>
      <form class="form" id="reqForm" style="margin-top:10px">
        <div class="two">
          <label class="f" for="r-kat">${t.fKat}<select id="r-kat" required>${KAT.map(x=>`<option value="${x}">${katL(x,L)}</option>`).join('')}</select></label>
          <label class="f" for="r-nal">${t.fNal}<select id="r-nal">${Object.keys(NAL).map(v=>`<option value="${v}">${t.NAL[v]}</option>`).join('')}</select></label>
        </div>
        <label class="f" for="r-popis">${t.fPopis}<textarea id="r-popis" required placeholder="${t.fPopisPh}"></textarea></label>
        <div class="two">
          <label class="f" for="r-kde">${t.fKde}<input id="r-kde" placeholder="${t.fKdePh}"></label>
          <label class="f" for="r-kdy">${t.fKdy}<input id="r-kdy" placeholder="${t.fKdyPh}"></label>
        </div>
        <label class="f" for="r-foto">${t.fFoto}<input id="r-foto" type="file" accept="image/*" multiple><span class="acct" style="text-transform:none;letter-spacing:0;font-weight:400">${t.fFotoHelp}</span></label>
        <label class="f" for="r-tel">${t.fTel}<input id="r-tel" type="tel" value="${esc(kontakt(o.id).telefon||'')}" placeholder="+420 …"></label>
        <p class="acct">${t.emerg}</p>
        <button class="primary" type="submit">${t.send}</button>
      </form>
    </details>
  </section>${pasHore?'':pasCard(o, L)}${dalsiCard(o, L)}${infoCard(L)}${faqCard(L)}${odkazyCard(L)}${oznPopup(o, L) || nabPopup(o, L)}</div>`;
  return h;
}

// ---------- správa: ověření žádostí
function navrhPredpis(adresaId){
  const c = {}; S.osoby.filter(o=>o.adresaId===adresaId && o.plati && +o.predpis>0).forEach(o=>c[o.predpis]=(c[o.predpis]||0)+1);
  const best = Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  return best ? +best[0] : 5795;
}
function dalsiVS(){
  const used = new Set(S.osoby.map(o=>String(o.vs||'')));
  let n = Math.max(1000, ...S.osoby.map(o=>+o.vs).filter(v=>v>=1000 && v<10000)) + 1;
  while (used.has(String(n))) n++;
  return String(n);
}

async function schvalitZadost(id){

  const osoba = base ? {...base, plati:true, predpis, od: base.plati && base.od && base.od < od ? base.od : od, vs: vs || base.vs || ''}
    : {id:oid, adresaId:z.adresaId, jmeno:z.jmeno, plati:true, predpis, predpisHist:[], od, vs, dluh:0, splatka:0, dluhOd:'', dluhRozpis:[], sDluh:0, sSplatka:0, sOd:'', srazkaOd:''};

const TV = {
  cs:{ h:'Kalkulačka vody', p:'Opište stavy z vodoměrů, třeba ze začátku a z konce měsíce. Spočítá se, kolik jste spotřebovali.',
    studena:'Studená voda', tepla:'Teplá voda', od:'Počáteční stav (m³)', do:'Konečný stav (m³)', meter:n=>`Vodoměr ${n}`, add:'+ Další vodoměr', remove:'Odebrat',
    spotreba:'Spotřeba', celkem:'Celkem voda', cena:'Odhad ceny', noPrice:'Cenu za m³ zatím nemáme nastavenou, proto ukazujeme jen spotřebu.',
    bad:'Konečný stav je menší než počáteční. Zkontrolujte čísla.', note:'Jde o orientační výpočet. Skutečnou částku určí vyúčtování.', per:c=>`${c} Kč/m³` },
  en:{ h:'Water calculator', p:'Copy the readings from your water meters, e.g. at the start and end of the month. It calculates how much you used.',
    studena:'Cold water', tepla:'Hot water', od:'Start reading (m³)', do:'End reading (m³)', meter:n=>`Meter ${n}`, add:'+ Another meter', remove:'Remove',
    spotreba:'Used', celkem:'Total water', cena:'Estimated cost', noPrice:'The price per m³ is not set yet, so only consumption is shown.',
    bad:'The end reading is lower than the start reading. Please check the numbers.', note:'This is an estimate. The actual amount is set by the utility bill.', per:c=>`CZK ${c}/m³` }
};
const num = v => { const x = parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isFinite(x) ? x : null; };
const m3 = (v, L) => (Math.round(v*1000)/1000).toLocaleString(L==='en'?'en-GB':'cs-CZ', {maximumFractionDigits:3}) + ' m³';
function vodaCalc(L){
  const t = TV[L], res = {}, cen = {studena:+S.nast.cenaStudena||0, tepla:+S.nast.cenaTepla||0};
  let bad = false;
  for (const typ of ['studena','tepla']) {
    res[typ] = 0;
    for (let i = 0; i < S.vodaN[typ]; i++) {
      const a = num(S.voda[`v-${typ}-${i}-od`]), b = num(S.voda[`v-${typ}-${i}-do`]);
      if (a === null || b === null) continue;
      if (b < a) { bad = true; continue; }
      res[typ] += b - a;
    }
  }
  const any = res.studena > 0 || res.tepla > 0, maCeny = cen.studena > 0 || cen.tepla > 0;
  const kcX = n => kcL(n, L);
  let h = `<div class="split">
    <div><span>${t.studena}</span><span><b>${m3(res.studena,L)}</b>${maCeny&&cen.studena?` · ${kcX(res.studena*cen.studena)}`:''}</span></div>
    <div><span>${t.tepla}</span><span><b>${m3(res.tepla,L)}</b>${maCeny&&cen.tepla?` · ${kcX(res.tepla*cen.tepla)}`:''}</span></div>
    <div style="border-top:1px solid var(--line2);padding-top:4px"><span>${t.celkem}</span><span><b>${m3(res.studena+res.tepla,L)}</b>${maCeny?` · <b>${kcX(res.studena*cen.studena+res.tepla*cen.tepla)}</b>`:''}</span></div></div>`;
  if (bad) h += `<div class="warnbox">${t.bad}</div>`;
  if (any && !maCeny) h += `<p class="acct">${t.noPrice}</p>`;
  if (maCeny) h += `<p class="acct">${[cen.studena?`${t.studena}: ${t.per(cen.studena)}`:'', cen.tepla?`${t.tepla}: ${t.per(cen.tepla)}`:''].filter(Boolean).join(' · ')}. ${t.note}</p>`;
  return h;
}
function vodaCard(L, o){
  if (o && S.voda['v-studena-0-od'] === undefined) { const k = posledniKontrola(o.adresaId); if (k && k.voda) { S.voda['v-studena-0-od'] = String(k.voda.studena).replace('.',','); S.voda['v-tepla-0-od'] = String(k.voda.tepla).replace('.',','); } }

async function odeslatKontrolu(form){
  const o = S.osoby.find(x=>x.id===S.osobaId); if (!o) return;
  const L = langOf(o.id), t = TK[L];
  const files = id => [...($('#'+id)?.files || [])].filter(f=>/^image\//.test(f.type)).slice(0,3);
  const fk = files('k-kuchyn'), fb = files('k-koupelna'), fv = files('k-vodomery');
  const st = num($('#k-studena').value), tp = num($('#k-tepla').value);
  if (!fk.length || !fb.length || st === null || tp === null) { toast(t.need); return; }
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = t.uploading;
  const up = async list => { const out = []; for (const f of list) out.push({url: await fotoData(f)}); return out; };
  try {
    const fotky = { kuchyn: await up(fk.slice(0,2)), koupelna: await up(fb.slice(0,2)), vodomery: await up(fv.slice(0,1)) };

    const ok = await write(async ()=>{ await db.doc('kontrolyFoto/'+id).set({adresaId:o.adresaId, ym, ...fotky}); await db.doc('kontroly/'+id).set(d); }, t.ok);
    if (!ok) { btn.disabled = false; btn.textContent = t.send; return; }
    S.simBlok = false;
  } catch { toast(t.fail); btn.disabled = false; btn.textContent = t.send; }
}

const PRAVIDLA_CS = `Pravidla pro ubytované platná od 1. července 2026
Milí ubytovaní, od 1. července 2026 platí následující pravidla pro údržbu, opravy, vybavení bytů a šetření energiemi a vodou.
1. Nová firma na údržbu
Začali jsme spolupracovat s jinou firmou na opravy a údržbu. Díky tomu by se potřebné opravy měly vyřizovat rychleji než dřív.
Hlášení závad zůstává stejné: každou závadu je dál potřeba nahlásit. Jak dlouho se na opravu čeká, záleží na tom, jaké informace uvedete při nahlášení.
2. Školení – jak šetřit vodou a teplem
Znovu proběhne školení, jak ve sdílené domácnosti šetřit vodou a teplem. Krátký návod také zveřejníme pro všechny.
Cílem je předejít vysokým doplatkům za služby v příštím roce.
3. Pračky a lednice
Všechny byty jsou vybavené pračkou a lednicí.
Pokud se spotřebič porouchá běžným používáním, MJM přispěje na opravu nebo případnou výměnu takto:
když v bytě bydlí 2 páry, MJM zaplatí 1/3 nákladů,
když v bytě bydlí 1 pár, MJM zaplatí 1/2 nákladů.
Pokud se spotřebič poškodí nesprávným používáním nebo vinou ubytovaných, opravu nebo výměnu platí nájemník / ubytovaný.
4. Poplatky za údržbu
Údržba se nově účtuje podle pravidel běžného vztahu pronajímatele a nájemníka podle českých zákonů.
Nájemník / ubytovaný platí běžnou údržbu a drobné opravy spojené s užíváním bytu. Patří sem například:
výměna žárovek,
čištění sifonů a odpadů,
výměna drobných součástek,
výměna těsnění,
výměna sprchových hadic,
drobné opravy vybavení a součástí bytu,
další běžná údržba vzniklá každodenním užíváním bytu.
5. Drobné opravy
Drobné opravy jsou menší opravy, které vzniknou běžným užíváním bytu. Platí je nájemník / ubytovaný, nebo je může provést údržba podle platného ceníku.
Přesný ceník údržby bude zveřejněný a dostupný všem ubytovaným.
6. Opravy, které platí pronajímatel
Pronajímatel platí větší opravy, které nejsou běžnou údržbou ani drobnou opravou. Patří sem například:
výměna kotle,
větší opravy elektřiny,
opravy rozvodů vody, plynu a elektřiny,
opravy částí, které jsou pevně spojené s bytem,
další větší technické závady, které nezpůsobil nájemník / ubytovaný.
7. Vybavení bytu
Vybavení bytu, jako jsou skříně, postele, matrace, nádobí a další základní vybavení, dostanete jen jednou, při nastěhování nebo při přestěhování do jiného bytu.
Pokud se vybavení poškodí, zničí nebo ztratí, výměnu nebo opravu si zajišťuje a platí nájemník / ubytovaný.
8. Ceník údržby
Ceník údržby zveřejníme, aby byl dostupný všem ubytovaným. Podle něj se bude účtovat práce, která patří do běžné údržby nebo drobných oprav placených nájemníkem / ubytovaným.

const PRAVIDLA_EN = `Rules for accommodated people valid from 1 July 2026
Dear community, from 1 July 2026, the following rules regarding maintenance, repairs, apartment equipment, and saving energy and water will come into effect.

Training sessions on how to save water and heat in a shared household will take place again. A short guide will also be shared in the community.

All apartments are equipped with a washing machine and a refrigerator.
If an appliance breaks down due to normal use, MJM will contribute to the repair or possible replacement as follows:
if 2 couples live in the apartment, MJM will contribute 1/3 of the costs,
if 1 couple lives in the apartment, MJM will contribute 1/2 of the costs.
If the appliance is damaged due to improper use or fault of the accommodated persons, the repair or replacement will be paid by the tenant/accommodated person.
4. Maintenance fees
Maintenance will now be charged according to the rules of the standard relationship between landlord and tenant under Czech legislation.
The tenant/accommodated person is responsible for paying for regular maintenance and minor repairs related to the use of the apartment. This includes, for example:
replacing light bulbs,
cleaning siphons and drains,
replacing small parts,
replacing seals,
replacing shower hoses,
minor repairs of apartment equipment and components,
other regular maintenance caused by everyday use of the apartment.
5. Minor repairs
Minor repairs are repairs of a smaller scale that arise from the normal use of the apartment. These repairs are paid by the tenant/accommodated person, or they may be carried out by maintenance according to the valid price list.

6. Repairs paid by the landlord

replacement of the boiler,
major electrical repairs,
repairs of water, gas, and electricity distribution systems,
repairs of parts that are permanently connected to the apartment,
other major technical defects that were not caused by the tenant/accommodated person.

function pravidlaHtml(txt){
  return `<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:13.5px">${(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>
    i===0 ? `<b style="font-size:14.5px">${esc(l)}</b>` : /^\d+\.\s/.test(l) ? `<b style="margin-top:6px">${esc(l)}</b>` : /^[a-zà-ž]/.test(l) ? `<span style="padding-left:12px">• ${esc(l)}</span>` : `<span>${esc(l)}</span>`).join('')}</div>`;
}
const GDPR_CS = `Informace o zpracování osobních údajů
Správce údajů: {SPRAVCE}. Kontakt pro dotazy: {EMAIL}.
1. Jaké údaje zpracováváme
Jméno, adresu ubytování, e-mail, telefon a jazyk. Platby a platební předpis. Údaje z pasu: jméno, datum narození, státní občanství, číslo a platnost pasu, číslo víza a bydliště v zahraničí. Fotky z kontroly bytu a z hlášení závad. Vaše žádosti a zprávy v aplikaci.
2. Proč je zpracováváme
Abychom vám mohli poskytovat ubytování a spravovat byt, evidovat platby, zajišťovat opravy a splnit zákonnou povinnost hlásit ubytování cizinců cizinecké policii.
3. Kdo údaje vidí
Údaje vidí jen správa ubytování MJM. Předáváme je pouze v nezbytném rozsahu:
Policii ČR, když hlásíme vaše ubytování (systém UbyPort),
firmě na údržbu, když nahlásíte závadu (jméno, adresa, telefon a popis závady).
Data jsou uložena u poskytovatele technologie Google Firebase na serverech v Evropské unii. Nikomu dalšímu je nedáváme a neprodáváme.
4. Jak dlouho údaje uchováváme
Po dobu vašeho ubytování. Potom jen tak dlouho, jak to vyžaduje zákon, například u plateb a hlášení policii.
5. Vaše práva
Máte právo vidět své údaje, opravit je, požádat o jejich výmaz, pokud už nejsou potřeba, a vznést námitku. Stížnost můžete podat u Úřadu pro ochranu osobních údajů (www.uoou.cz).`;
const GDPR_EN = `Information on personal data processing
Data controller: {SPRAVCE}. Contact for questions: {EMAIL}.
1. What data we process
Your name, accommodation address, email, phone and language. Payments and your payment order. Passport details: name, date of birth, nationality, passport number and expiry, visa number and home address abroad. Photos from flat checks and repair reports. Your requests and messages in the app.
2. Why we process it
To provide your accommodation and manage the flat, keep track of payments, arrange repairs and meet the legal duty to report the accommodation of foreigners to the foreign police.
3. Who can see the data
Only MJM accommodation management can see your data. We pass it on only as far as necessary:
to the Czech Police when we report your accommodation (UbyPort system),
to the maintenance company when you report a problem (name, address, phone and description of the problem).
The data is stored with the technology provider Google Firebase on servers in the European Union. We do not give or sell it to anyone else.
4. How long we keep the data
For the time of your accommodation. After that only as long as the law requires, for example for payments and police reports.
5. Your rights
You have the right to see your data, correct it, ask for it to be deleted when it is no longer needed, and object. You can file a complaint with the Czech Office for Personal Data Protection (www.uoou.cz).`;
const gdprText = L => (L==='en' ? GDPR_EN : GDPR_CS).replace('{SPRAVCE}', S.nast.spravce || 'MJM (název firmy, IČO a sídlo doplníme)').replace('{EMAIL}', S.nast.emailUpozorneni || 'b.krejcova@mjmreality.cz');
const gdprDetails = (L, lbl) => `<details class="more"><summary>${lbl || (L==='en'?'Personal data protection':'Ochrana osobních údajů')}</summary>${pravidlaHtml(gdprText(L))}</details>`;

function viewDalsi(){

  const item = z => { const o = S.osoby.find(x=>x.id===z.osobaId) || {jmeno:'?'}, st = zs[z.stav] || ['mute', z.stav];
    const steh = z.druh==='stehovani', vol = z.druh==='volno';
    return `<div class="item"><div class="who"><div class="row"><b>${esc(o.jmeno)}</b><span class="pill ${st[0]}">${st[1]}</span></div>
      <div>${vol?`${z.pocet||1}× ${TD.cs.volTypy[z.typ]||''} volné od <b>${fDate(z.datum)}</b>`:steh?`${TD.cs.stehTypy[z.typ]} · <b>${fDate(z.datum)}</b>${z.klice?` · klíče: ${esc(z.klice)}`:''}${z.nova?` · nová adresa: ${esc(z.nova)}`:''}`:`${TD.cs.potUcely[z.ucel]}${z.termin?` · potřebuje do <b>${fDate(z.termin)}</b>`:''}`}</div>
      <div class="acct">${esc(adresaOf(o).adresa||'')}${kontakt(o.id).telefon?` · ${esc(kontakt(o.id).telefon)}`:''} · podáno ${fDate(z.vytvoreno.slice(0,10))}${z.poznamka?` · „${esc(z.poznamka)}“`:''}</div>
      ${!steh&&!vol?`<div class="acct">Bydlí od: ${o.od?mLabel(o.od):'neuvedeno'}</div>`:''}</div>

      ${z.stav!=='hotovo'?`<div class="row" style="grid-column:1/-1"><input id="dz-${z._id}" placeholder="${steh?'Vzkaz nájemníkovi, např. klíče předáme v sobotu v 10:00':'Vzkaz nájemníkovi, např. vyzvedněte si ho v kanceláři'}" value="${esc(z.odpoved||'')}" style="flex:1 1 260px"><button data-act="dVzkaz" data-id="${z._id}">Uložit vzkaz</button></div>`:''}</div>`; };
  const g = (druh, stav) => S.zadostiDalsi.filter(z=>z.druh===druh && (stav ? z.stav===stav : z.stav!=='hotovo')).sort((a,b)=>(a.datum||a.termin||'').localeCompare(b.datum||b.termin||''));
  return `<section class="panel"><h2>Volná místa v bytech <span class="pill mute">${g('volno').length}</span></h2><p class="note">Nájemníci sami hlásí volné lůžko nebo pokoj.</p>${g('volno').map(item).join('') || '<p class="acct">Nikdo nic nenahlásil.</p>'}</section>
    <section class="panel"><h2>Stěhování <span class="pill mute">${g('stehovani').length}</span></h2>${g('stehovani').map(item).join('') || '<p class="acct">Nikdo se zatím nestěhuje.</p>'}</section>

async function pasExport(kdo){
  const doDef = $('#pd-do')?.value || S.nast.ubyDo || '';
  const rows = S.osoby.map(o=>({o, p:pasOf(o.id)})).filter(x=>x.p && x.p.obcanstvi!=='Česká republika' && (kdo==='vse' || kNahlaseni(x.p)));
  if (!rows.length) { toast('Není co stáhnout.'); return; }
  const d8 = iso => iso ? iso.split('-').reverse().join('.') : '';
  const cell = v => { v = String(v ?? ''); return /[;"\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const head = ['Příjmení','Jméno','Datum narození','Státní občanství','Číslo cestovního dokladu','Číslo víza','Bydliště v zahraničí','Účel pobytu','Ubytován od','Ubytován do','Adresa ubytování','Poznámka'];
  const data = rows.map(({o,p}) => [p.prijmeni, p.jmeno, d8(p.narozeni), p.obcanstvi, p.pas, p.vizum, p.bydliste, (UCELY[p.ucel]||[p.ucel])[0], d8(p.od), d8(p.do || doDef), adresaOf(o).adresa || '',
    p.nahlaseno && p.nahlasenyPas && p.nahlasenyPas !== p.pas ? `Změna pasu, dříve ${p.nahlasenyPas}` : (p.nahlaseno ? 'Změna údajů' : '')]);
  const csv = '﻿' + [head, ...data].map(r=>r.map(cell).join(';')).join('\r\n');
  try { stahnout(`ubyport_${todayISO()}_${kdo==='vse'?'vsichni':'k-nahlaseni'}.csv`, csv, 'text/csv'); toast('Tabulka stažena'); }
  catch(e){ if (e && e.code==='declined') return; toast('Stažení se nepovedlo.'); }
}

// ---------- upomínky: kdo dostane jaký e-mail
function upominky(){
  const out = { pred:[], po:[] };
  for (const o of S.osoby) {
    if (!o.plati && !(+o.sDluh>0) && !(+o.dluh>0)) continue;
    const p = plan(o);
    if (p.overSum > 0.5) {
      const dni = Math.round((new Date(p.today) - new Date(p.overdue[0].due))/86400000);
      out.po.push({o, p, dni, druha: dni >= (+S.nast.dniPo2||14)});
    }
    if (p.nextSum > 0.5) out.pred.push({o, p});
  }
  out.po.sort((a,b)=>b.p.overSum-a.p.overSum);
  out.pred.sort((a,b)=>a.o.jmeno.localeCompare(b.o.jmeno,'cs'));
  return out;
}

  $('#modeSeg').hidden = !(S.admin && S.phase==='app'); $('#logout').hidden = S.phase==='login' || S.phase==='loading';
  $('#protoNote').hidden = !(S.admin && S.phase==='app');
  $('#view').innerHTML = S.phase!=='app' ? viewPhase() : S.mode==='najemnik' ? viewTenant() : viewAdmin();
  if (f) { const el = document.getElementById(f); if (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) { el.focus(); try{ if (sel!=null) el.setSelectionRange(sel,sel); }catch{} } }

// ---------- zápisy
async function write(fn, ok){
  if (!db) { toast('Ukládání teď není dostupné.'); return false; }
  try { await fn(); if (ok) toast(ok); return true; }
  catch(e){ console.error(e); toast(e && /permission/.test(e.code||'') ? 'Nemáte oprávnění ukládat.' : 'Uložení se nepovedlo, zkuste to znovu.'); return false; }
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('Zkopírováno'); }
  catch { toast('Kopírování nejde, označte text ručně.'); }
}
document.addEventListener('click', ev => { const sm = ev.target.closest('summary[data-kform]'); if (sm) S.open.kform = !S.open.kform; });
document.addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { S.mode = b.dataset.mode; render(); return; }

  if (b.dataset.nassel) { const q = (S.nasQ||'').toLowerCase(); if (b.dataset.nassel==='nic') S.nasAdr.clear(); else S.adresy.filter(a=>!q || a.adresa.toLowerCase().includes(q)).forEach(a=>S.nasAdr.add(a.id)); render(); return; }
  if (b.dataset.schden) { S.schDen = b.dataset.schden; S.schCas = ''; render(); return; }
  if (b.dataset.schcas) { S.schCas = b.dataset.schcas; render(); return; }
  if (b.dataset.schmes) { S.schMes = addM(S.schMes || nowYM(), +b.dataset.schmes); S.schVyb = ''; render(); return; }
  if (b.dataset.calden) { S.schVyb = b.dataset.calden; render(); return; }
  if (b.dataset.slot || b.dataset.slotall || b.dataset.kopie) {
    const d = S.schVyb, ym = d.slice(0,7), dny = {...((S.dostupnost[ym]||{}).dny||{})}; let cur = new Set(dny[d]||[]);
    if (b.dataset.slot) { cur.has(b.dataset.slot) ? cur.delete(b.dataset.slot) : cur.add(b.dataset.slot); }
    if (b.dataset.slotall==='dop') CASY.filter(c=>c>='08:00' && c<'12:00').forEach(c=>cur.add(c));
    if (b.dataset.slotall==='odp') CASY.filter(c=>c>='13:00' && c<'17:00').forEach(c=>cur.add(c));
    if (b.dataset.slotall==='nic') cur = new Set();
    dny[d] = [...cur].sort(); if (!dny[d].length) delete dny[d];
    if (b.dataset.kopie) {
      const [y,m] = ym.split('-').map(Number), w0 = new Date(d+'T12:00:00').getDay();
      for (let i = 1; i <= new Date(y, m, 0).getDate(); i++) { const iso = `${ym}-${String(i).padStart(2,'0')}`, w = new Date(iso+'T12:00:00').getDay();
        if (iso === d || iso < todayISO()) continue;

  if (b.dataset.voda) { const typ = b.dataset.voda.slice(1); if (b.dataset.voda[0]==='+') S.vodaN[typ] = Math.min(4, S.vodaN[typ]+1); else { const i = --S.vodaN[typ]; delete S.voda[`v-${typ}-${i}-od`]; delete S.voda[`v-${typ}-${i}-do`]; } render(); return; }

  if (b.dataset.nab) {

// fotky z telefonu zmenšit na rozumnou velikost, ať se rychle nahrají
async function zmensitFoto(file){
  try {
    const img = await createImageBitmap(file); const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
    if (k === 1 && file.size < 1.5e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.82));
  } catch { return file; }
}
async function fotoData(file){
  const img = await createImageBitmap(file); const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.6);
}

}

function makeDb(F){
  const ref = p => F.doc(F.fs, p);
  const wrapDoc = s => ({ id:s.id, exists:s.exists(), data:()=>s.data() });
  const wrapQ = q => ({ docs:q.docs.map(d=>({ id:d.id, data:()=>d.data() })) });
  const mkQ = (name, conds) => conds.length ? F.query(F.collection(F.fs, name), ...conds.map(c=>F.where(c[0], c[1], c[2]))) : F.collection(F.fs, name);
  const coll = (name, conds=[]) => ({
    where: (f, o, v) => coll(name, [...conds, [f, o, v]]),
    add: d => F.addDoc(F.collection(F.fs, name), d),
    get: async () => wrapQ(await F.getDocs(mkQ(name, conds))),
    onSnapshot: (cb, err) => F.onSnapshot(mkQ(name, conds), q=>cb(wrapQ(q)), err)
  });
  return {
    doc: p => ({
      get: async () => wrapDoc(await F.getDoc(ref(p))),
      set: (d, opt) => opt ? F.setDoc(ref(p), d, opt) : F.setDoc(ref(p), d),

async function uzSchvalit(uid){
  const u = S.uzivatele.find(x=>x._id===uid); if (!u) return;
  const sel = document.getElementById('uo-'+uid)?.value || '';
  let oid = sel, o = sel ? S.osoby.find(x=>x.id===sel) : null;
  const ops = [], now = new Date().toISOString();
  if (!o) { oid = 'n' + Date.now().toString(36); o = {id:oid, jmeno:u.jmeno, adresaId:u.adresaId, plati:false, predpis:0, vs:dalsiVS(), od:''}; ops.push(['set', 'osoby/'+oid, o]); }
  const upd = {uid, email:u.email||''};
  if (duvodPlati(u.duvod)) {
    const pr = +(document.getElementById('up-'+uid)?.value||0), od = document.getElementById('uod-'+uid)?.value||'';
    if (!(pr > 0) || !od) { toast('Vyplňte předpis a měsíc, od kdy platí.'); return; }
    Object.assign(upd, {plati:true, predpis:pr, od, zPortalu:{duvod:u.duvod, odData:u.od||'', schvaleno:now}});
  }
  ops.push(['update', 'osoby/'+oid, upd]);
  ops.push(['set', 'kontakty/'+oid, {...kontakt(oid), email:u.email||'', telefon:u.telefon||'', jazyk:u.jazyk==='en'?'en':'cs'}]);
  ops.push(['update', 'uzivatele/'+uid, {stav:'schvaleno', osobaId:oid, adresaId:o.adresaId, schvaleno:now}]);
  await write(()=>db.batch(ops), 'Potvrzeno. Nájemník teď uvidí svoje údaje.');
}

      <div><b>${all.filter(o=>o.plati && !(+o.predpis>0)).length}</b><span>platí, ale nemá předpis</span></div></div>
    <p class="note" style="margin-bottom:10px">Předpis a „platí“ můžete měnit rovnou tady, uloží se po opuštění políčka. Nájemník uvidí částku a QR kód, jen když platí a má předpis. Dluhy ve zkušební verzi nevidí.</p>
    <div class="row" style="margin-bottom:10px"><input type="search" id="q" placeholder="Hledat jméno, adresu, VS, kód nebo e-mail" value="${esc(S.q)}" aria-label="Hledat" style="max-width:420px"><button data-kod="csv">Stáhnout tabulku kódů</button></div>
    <p class="note" style="margin-bottom:10px">Přístupový kód nájemník zadá při registraci a aplikace ho sama přiřadí ke správnému člověku. Každý kód jde použít jen jednou. Když ho někdo ztratí nebo ho použil někdo cizí, klikněte na „Nový“ a u potvrzeného účtu v Registracích „Zrušit přístup“.</p>
    <div class="panel" style="padding:0"><div class="tbl"><table><thead><tr><th>Jméno</th><th>Adresa</th><th>VS</th><th>Platí</th><th>Předpis Kč</th><th>Přístupový kód</th><th>Účet v aplikaci</th><th>Telefon</th></tr></thead><tbody>
    ${list.map(o=>{const kk = kontakt(o.id); return `<tr><td><b>${esc(o.jmeno)}</b></td><td class="acct">${esc(adresaOf(o).adresa||'')}</td><td>${o.vs?esc(o.vs):'<span class="pill warn">chybí</span>'}</td>
      <td><input type="checkbox" data-osf="plati" data-id="${o.id}" aria-label="Platí ${esc(o.jmeno)}"${o.plati?' checked':''} style="width:auto"></td>
      <td><input type="number" step="1" min="0" data-osf="predpis" data-id="${o.id}" value="${+o.predpis||''}" aria-label="Předpis ${esc(o.jmeno)}" style="width:100px"></td>
      <td style="white-space:nowrap">${o.kod?`<code style="font:600 13px ui-monospace,Menlo,Consolas,monospace">${fmtKod(o.kod)}</code>${S.kody[o.kod]&&S.kody[o.kod].uid?' <span class="pill ok">použit</span>':''}`:'<span class="pill mute">—</span>'} <button class="ghost" data-kod="novy" data-id="${o.id}" title="Vytvořit nový kód, starý přestane platit">Nový</button></td>
      <td>${maUcet(o)?`<span class="pill ok">ano</span> <span class="acct">${esc(kk.email||o.email||'')}</span>`:'<span class="pill mute">zatím ne</span>'}</td>
      <td class="acct">${esc(kk.telefon||'')}</td></tr>`;}).join('')}
    </tbody></table></div></div>`;
}
const maUcet = o => o.uid || S.uzivatele.some(u=>u.osobaId===o.id && u.stav==='schvaleno');
async function novyKodPro(oid){
  const o = S.osoby.find(x=>x.id===oid); if (!o) return;
  const kod = novyKod(), ops = [['set', 'kody/'+kod, {osobaId:o.id, adresaId:o.adresaId, jmeno:o.jmeno, uid:''}], ['update', 'osoby/'+o.id, {kod}]];
  if (o.kod && S.kody[o.kod] && !S.kody[o.kod].uid) ops.push(['delete', 'kody/'+o.kod]);
  const ok = await write(()=>db.batch(ops), `Nový kód pro ${o.jmeno}: ${fmtKod(kod)}`);
  if (ok) toast(`Nový kód: ${fmtKod(kod)}. Starý kód už neplatí.`);
}
function stahnoutKody(){
  const cell = v => { v = String(v ?? ''); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const rows = [...S.osoby].sort((a,b)=>(adresaOf(a).poradi||0)-(adresaOf(b).poradi||0) || (adresaOf(a).adresa||'').localeCompare(adresaOf(b).adresa||'','cs') || a.jmeno.localeCompare(b.jmeno,'cs'))
    .map(o=>[adresaOf(o).adresa||'', o.jmeno, o.vs||'', fmtKod(o.kod), maUcet(o)?'ano':'ne']);
  stahnout(`pristupove-kody_${todayISO()}.csv`, '\ufeff' + [['Adresa','Jméno','Variabilní symbol','Přístupový kód','Má účet'], ...rows].map(r=>r.map(cell).join(';')).join('\r\n'), 'text/csv');
}
function importPanel(){
  return `<section class="panel"><h2>Nahrát data</h2>
    <p class="note">Nahraje adresy, nájemníky a nastavení ze souboru, který vám pošlu. Když ho nahrajete znovu, údaje se jen aktualizují: nic se nesmaže a registrace nájemníků zůstanou.</p>
    <div class="row"><input type="file" id="imp-file" accept=".json,application/json" style="max-width:340px"><button class="primary" data-act="import">Nahrát</button></div>
    <p class="acct">V aplikaci je teď ${S.adresy.length} adres a ${S.osoby.length} lidí.</p></section>`;
}
async function importDat(){
  const f = $('#imp-file')?.files?.[0]; if (!f) { toast('Vyberte soubor.'); return; }
  let data; try { data = JSON.parse(await f.text()); } catch { toast('Soubor se nepodařilo přečíst.'); return; }
  const ops = [];
  for (const a of data.adresy||[]) ops.push(['merge', 'adresy/'+a.id, a]);
  for (const o of data.osoby||[]) ops.push(['merge', 'osoby/'+o.id, o]);
  if (data.nastaveni) ops.push(['merge', 'nastaveni/portal', data.nastaveni]);
  for (const k of data.kody||[]) { if (!S.kody[k.kod]) ops.push(['set', 'kody/'+k.kod, {osobaId:k.osobaId, adresaId:k.adresaId, jmeno:k.jmeno||'', uid:''}]); }
  if (!ops.length) { toast('V souboru nejsou žádná data.'); return; }
  await write(()=>db.batch(ops), `Nahráno: ${(data.adresy||[]).length} adres, ${(data.osoby||[]).length} lidí${(data.kody||[]).length?` a ${(data.kody||[]).length} přístupových kódů`:''}.`);
}
function nactiFotky(ym){
  if (!S.admin || S.kFotoLoaded[ym]) return;
  S.kFotoLoaded[ym] = 1;
  db.collection('kontrolyFoto').where('ym', '==', ym).get().then(q=>{ q.docs.forEach(d=>S.kFoto[d.id] = d.data()); render(); }).catch(e=>console.warn(e));
}

// ---------- načtení dat podle toho, kdo je přihlášený
const arr = q => q.docs.map(d=>({...d.data(), _id:d.id}));
const map = q => { const m = {}; q.docs.forEach(d=>m[d.id] = d.data()); return m; };
function sub(ref, cb, list=UNSUB){ list.push(ref.onSnapshot(x=>{ cb(x); render(); }, e=>console.warn('snapshot', e))); }
function subAdmin(){
  const c = (n, fn) => sub(db.collection(n), fn);
  c('osoby', q=>{ S.seedOsoby = q.docs.map(d=>({...d.data(), id:d.id})); mergeOsoby(); });
  c('kontakty', q=>{ S.kontakty = map(q); });
  c('uzivatele', q=>{ S.uzivatele = arr(q); });
  c('kody', q=>{ S.kody = map(q); });
  c('pozadavky', q=>{ S.pozadavky = arr(q); });
  c('kontroly', q=>{ S.kontroly = map(q); S.kFotoLoaded = {}; });
  c('nastenka', q=>{ S.nastenka = arr(q); });
  c('dalsi', q=>{ S.zadostiDalsi = arr(q); });
  c('dostupnost', q=>{ S.dostupnost = map(q); });
  c('schuzky', q=>{ S.schuzky = arr(q); });
  c('sloty', q=>{ S.sloty = arr(q); });
  c('oznameni', q=>{ S.oznameni = arr(q); });
  c('potvrzeni', q=>{ S.potvrzeni = map(q); });
  c('zadosti', q=>{ S.zadosti = arr(q); });
  c('pasy', q=>{ S.pasy = map(q); });
  c('zajemci', q=>{ S.zajemci = map(q); });
  c('nabidky', q=>{ S.nabidky = arr(q); });
  c('prihlasky', q=>{ S.prihlasky = map(q); });
}
function subTenant(){
  TUNSUB.splice(0).forEach(f=>{ try { f(); } catch {} });
  const oid = S.me.osobaId, aid = S.me.adresaId, t = (ref, cb) => sub(ref, cb, TUNSUB);
  const q = (n, f, v, op='==') => db.collection(n).where(f, op, v);
  S.osobaId = oid;
  t(db.doc('osoby/'+oid), s=>{ S.seedOsoby = s.exists ? [{...s.data(), id:oid}] : []; mergeOsoby(); });
  t(db.doc('kontakty/'+oid), s=>{ S.kontakty = s.exists ? {[oid]: s.data()} : {}; });
  t(db.doc('pasy/'+oid), s=>{ S.pasy = s.exists ? {[oid]: s.data()} : {}; });
  t(db.doc('zajemci/'+oid), s=>{ S.zajemci = s.exists ? {[oid]: s.data()} : {}; });
  t(q('pozadavky', 'osobaId', oid), x=>{ S.pozadavky = arr(x); });
  t(q('kontroly', 'adresaId', aid), x=>{ S.kontroly = map(x); });
  t(q('dalsi', 'osobaId', oid), x=>{ S.zadostiDalsi = arr(x); });
  t(q('schuzky', 'osobaId', oid), x=>{ S.schuzky = arr(x); });
  t(db.collection('sloty'), x=>{ S.sloty = arr(x); });
  t(db.collection('dostupnost'), x=>{ S.dostupnost = map(x); });
  t(q('oznameni', 'adresaIds', aid, 'array-contains'), x=>{ S.oznameni = arr(x); });
  t(q('potvrzeni', 'osobaId', oid), x=>{ S.potvrzeni = map(x); });
  t(q('zadosti', 'osobaId', oid), x=>{ S.zadosti = arr(x); });
  t(db.collection('nabidky'), x=>{ S.nabidky = arr(x); });
  t(q('prihlasky', 'osobaId', oid), x=>{ S.prihlasky = map(x); });
  let nA = [], nB = []; const nas = () => { const m = new Map(); [...nA, ...nB].forEach(x=>m.set(x._id, x)); S.nastenka = [...m.values()]; };
  t(q('nastenka', 'vsem', true), x=>{ nA = arr(x); nas(); });
  t(q('nastenka', 'adresaIds', aid, 'array-contains'), x=>{ nB = arr(x); nas(); });
}
async function onUser(){
  UNSUB.splice(0).forEach(f=>{ try { f(); } catch {} }); TUNSUB.splice(0).forEach(f=>{ try { f(); } catch {} });
  const u = S.user;
  if (!u) { if (S.hadUser) S.authMode = 'login'; S.hadUser = false; S.phase = 'login'; S.admin = false; S.me = null; render(); return; }
  S.hadUser = true;
  if (!u.emailVerified) { S.phase = 'verify'; render(); return; }
  S.admin = ADMINS.includes(u.email);
  sub(db.doc('nastaveni/portal'), s=>{ S.portal = s.exists ? s.data() : {}; S.nast = {...S.nast, ...S.portal}; });
  sub(db.collection('adresy'), q=>{ S.adresy = q.docs.map(d=>({...d.data(), id:d.id})).sort((a,b)=>(a.poradi||0)-(b.poradi||0) || String(a.adresa).localeCompare(String(b.adresa),'cs')); });
  if (S.admin) { S.mode = 'sprava'; S.tab = 'registrace'; S.phase = 'app'; subAdmin(); render(); return; }
  S.mode = 'najemnik';
  sub(db.doc('uzivatele/'+u.uid), s=>{
    const prev = S.me; S.me = s.exists ? s.data() : null;
    const st = S.me ? S.me.stav : '';
    if (st === 'schvaleno') { if (!prev || prev.stav !== 'schvaleno' || prev.osobaId !== S.me.osobaId) subTenant(); S.phase = 'app'; }
    else { S.phase = st === 'ceka' ? 'pending' : 'register'; if (S.me && S.me.jazyk && !prev) S.regLang = S.me.jazyk; }
  });
}
function setRegLang(l){ S.regLang = l; try { localStorage.setItem('mjmLang', l); } catch {} if (AUTH && AUTH.setLang) AUTH.setLang(l); }

// ---------- události přihlášení a registrace
document.addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const L = S.regLang, t = TA[L];
  if (b.dataset.reglang) { setRegLang(b.dataset.reglang); return; }
  if (b.dataset.auth) {
    const a = b.dataset.auth;
    try {
      if (a==='google') await AUTH.google();
      if (a==='mode') { S.authMode = S.authMode==='register' ? 'login' : 'register'; render(); }
      if (a==='reset') { const e = ($('#a-email')?.value||'').trim(); if (!e) { toast(t.needEmail); return; } await AUTH.reset(e); toast(t.resetOk); }
      if (a==='resend') { await AUTH.resend(); toast(t.resent); }
      if (a==='reloaded') { const u = await AUTH.reload(); if (!u.emailVerified) { toast(t.notYet); return; } S.user = u; await onUser(); }
      if (a==='logout') { await AUTH.logout(); location.reload(); }
    } catch (e) { const m = authErr(e, L); if (m) toast(m); console.warn(e); }
    return;
  }
  if (b.dataset.uz) {
    const id = b.dataset.id, v = b.dataset.uz;
    if (v==='ok') { b.disabled = true; await uzSchvalit(id); b.disabled = false; }
    if (v==='noAsk') { S.open['uz'+id] = 1; render(); document.getElementById('uzd-'+id)?.focus(); }
    if (v==='zrusit') { await write(()=>db.doc('uzivatele/'+id).update({stav:'zruseno', zruseno:new Date().toISOString()}), 'Přístup zrušen. Nájemníkovi vytvořte nový kód.'); return; }
    if (v==='no') { await write(()=>db.doc('uzivatele/'+id).update({stav:'zamitnuto', duvodZamitnuti:(document.getElementById('uzd-'+id)?.value||'').trim()}), 'Zamítnuto'); delete S.open['uz'+id]; }
    return;
  }
  if (b.dataset.kod) { if (b.dataset.kod==='csv') stahnoutKody(); else { b.disabled = true; await novyKodPro(b.dataset.id); b.disabled = false; } return; }
  if (b.dataset.act==='import') { b.disabled = true; await importDat(); b.disabled = false; }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.osf) {
    const id = t.dataset.id, f = t.dataset.osf, v = f==='plati' ? t.checked : (+t.value || 0);
    await write(()=>db.doc('osoby/'+id).update({[f]: v}), 'Uloženo');
  }
});
document.addEventListener('submit', async ev => {
  const L = S.regLang, t = TA[L];
  if (ev.target.id==='authForm') {
    ev.preventDefault();
    const e = $('#a-email').value.trim(), p = $('#a-heslo').value;
    const btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      if (S.authMode==='register') { if (p !== $('#a-heslo2').value) { toast(t.hesla); btn.disabled = false; return; } await AUTH.register(e, p); }
      else await AUTH.login(e, p);
    } catch (er) { const m = authErr(er, L); if (m) toast(m); console.warn(er); }
    btn.disabled = false; return;
  }
  if (ev.target.id==='kodForm') {
    ev.preventDefault();
    const kod = normKod($('#k-kod').value), tel = $('#k-tel').value.trim();
    if (!kod || !tel || !$('#k-gdpr').checked) { toast(TZ[L].chyba); return; }
    const btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      let k = null; try { const s = await db.doc('kody/'+kod).get(); k = s.exists ? s.data() : null; } catch (e) { console.warn(e); }
      if (!k) { toast(t.kodBad); btn.disabled = false; return; }
      if (k.uid && k.uid !== S.user.uid) { toast(t.kodUsed); btn.disabled = false; return; }
      const now = new Date().toISOString();
      await db.batch([
        ['set', 'uzivatele/'+S.user.uid, {stav:'schvaleno', kod, osobaId:k.osobaId, adresaId:k.adresaId, jmeno:k.jmeno||'', email:S.user.email, telefon:tel, jazyk:L, gdpr:now, vytvoreno:now, schvaleno:now, cesta:'kod'}],
        ['update', 'kody/'+kod, {uid:S.user.uid}]
      ]);
      try { await db.doc('kontakty/'+k.osobaId).set({email:S.user.email, telefon:tel, jazyk:L}); } catch (e) { console.warn(e); }
      toast(t.kodOk);
    } catch (e) { console.error(e); toast(/permission/.test(e.code||'') ? t.kodUsed : TZ[L].chyba); }
    btn.disabled = false; return;
  }
  if (ev.target.id==='uzForm') {
    ev.preventDefault();
    const tz = TZ[L], f = ev.target;
    const d = { stav:'ceka', jmeno:$('#z-jmeno').value.trim(), adresaId:$('#z-adresa').value, email:S.user.email, telefon:$('#z-tel').value.trim(), jazyk:L,
      duvod:(f.querySelector('input[name=z-duvod]:checked')||{}).value||'nic', od:$('#z-od').value, zamestnavatel:$('#z-zam').value.trim(), poznamka:$('#z-pozn').value.trim(),
      gdpr:new Date().toISOString(), vytvoreno:new Date().toISOString() };
    if (!d.jmeno || !d.adresaId || !d.telefon || !d.od || !$('#z-gdpr').checked) { toast(tz.chyba); return; }
    await write(()=>db.doc('uzivatele/'+S.user.uid).set(d), t.sent);
  }
}, true);

// ---------- start
(async () => {
  try { const l = localStorage.getItem('mjmLang'); if (l==='cs' || l==='en') S.regLang = l; } catch {}
  render();
  try {
    if (window.__MOCK) { db = window.__MOCK.db; AUTH = window.__MOCK.auth; }
    else {
      await new Promise((res, rej) => { if (window.FB) return res(); window.addEventListener('fbready', res, {once:true}); setTimeout(()=>rej(new Error('Firebase se nenačetl')), 20000); });
      db = makeDb(window.FB); AUTH = makeAuth(window.FB);
    }
  } catch (e) { console.error(e); S.phase = 'error'; render(); return; }
  S.downloads = true; setRegLang(S.regLang);
  AUTH.onChange(u => { S.user = u; onUser().catch(e=>{ console.error(e); S.phase = 'error'; render(); }); });
})();
</script>

</body></html>
